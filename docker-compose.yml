# Entorno local completo. Se levanta con: docker compose up -d
# Cada etapa suma servicios acá (panel en la 2, Airflow en la 5).
name: data-eng-ventas

services:
  # Data warehouse local: acá vivirán las capas silver y gold (dbt, etapa 4).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # "127.0.0.1:" = solo accesible desde TU PC. Sin eso Docker publica el puerto en todas
      # las interfaces y cualquiera en tu misma red Wi-Fi podría intentar conectarse.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a `docker compose down`.
      # Solo se borran con `docker compose down -v`.
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Data lake local, compatible con S3 (capa bronze y archivos crudos).
  # Usamos RustFS porque MinIO dejó de publicar imágenes de Docker en 2025-2026.
  # Versión fija (no "latest") para que el entorno no cambie solo de un día para otro.
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:9000:9000"   # API S3 (la que usa boto3)
      - "127.0.0.1:9001:9001"   # Consola web para mirar los buckets
    volumes:
      - s3_data:/data
    restart: unless-stopped

  # Contenedor de un solo uso: espera a que todo esté arriba, crea los buckets
  # (si no existen) y termina. Es la "prueba de humo" del entorno.
  init:
    build: .
    env_file: .env
    environment:
      # Adentro de la red de Docker cada servicio se llama por su nombre, no "localhost".
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://s3:9000
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: "no"

  # Panel del proyecto: http://localhost:8501
  dashboard:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://s3:9000
      REPO_ROOT: /repo
      # Usamos el código montado de /repo (y no la copia de la imagen) para ver cambios al instante.
      PYTHONPATH: /repo/src:/repo/dashboard
    # Desde esta carpeta Streamlit encuentra su configuración (.streamlit/config.toml).
    working_dir: /repo/dashboard
    command: ["streamlit", "run", "app.py"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # El repo entero en SOLO LECTURA: el panel lo lee para el mapa, pero no puede modificarlo.
      # (Incluye .env, pero el contenedor ya recibe esos valores vía env_file: no expone nada nuevo).
      - .:/repo:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_data:
  s3_data:
